# Per-topic publishing configuration.
# Paths: queue/{lang}/{Topic}/ → cards/{lang}/{Topic}/
# Languages: see languages.yaml (en, es, de). Publish runs for each language unless --lang is set.

defaults:
  cards_per_publish: 2
  schedule: "0 8 * * *"  # daily at 08:00 UTC

generate:
  schedule: "0 6 * * *"  # daily at 06:00 UTC (before publish)
  branch: automation/draft-cards  # shared PR branch for draft automation
  languages: [en, es, de]
  defaults:
    cards: 5

topics:
  geography:
    enabled: true
    rate: 2
    age_bands: [early, middle]
    subtopics: [continents, oceans, countries]
    generate:
      enabled: true
      cards: 5

  space:
    enabled: true
    rate: 2
    age_bands: [early, middle, teen]
    subtopics: [solar_system, moon, stars]
    generate:
      enabled: true
      cards: 5

  animals:
    enabled: true
    rate: 2
    age_bands: [early, middle]
    subtopics: [pets, farm, ocean]
    generate:
      enabled: true
      cards: 5

  sports:
    enabled: true
    rate: 1
    age_bands: [early, middle]
    subtopics: [football, basketball, olympics]
    generate:
      enabled: true
      cards: 4

  science:
    enabled: true
    rate: 2
    age_bands: [early, middle]
    subtopics: [body, plants, weather]
    generate:
      enabled: true
      cards: 5
