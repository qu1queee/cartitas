# Per-topic publishing configuration.
# Each enabled topic releases up to `rate` cards per run from queue/{Topic}/ into cards/{Topic}/.

defaults:
  cards_per_publish: 2
  schedule: "0 8 * * *"  # daily at 08:00 UTC

topics:
  geography:
    enabled: true
    rate: 2
    age_bands: [early, middle]
    subtopics: [continents, oceans, countries]

  space:
    enabled: true
    rate: 2
    age_bands: [early, middle, teen]
    subtopics: [solar_system, moon, stars]

  animals:
    enabled: true
    rate: 2
    age_bands: [early, middle]
    subtopics: [pets, farm, ocean]

  sports:
    enabled: true
    rate: 1
    age_bands: [early, middle]
    subtopics: [football, basketball, olympics]

  science:
    enabled: true
    rate: 2
    age_bands: [early, middle]
    subtopics: [body, plants, weather]
