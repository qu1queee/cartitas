name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Publish pushes with GITHUB_TOKEN do not trigger workflow `push` events.
  # Rebuild Pages after a successful publish so the site picks up new cards.
  workflow_run:
    workflows: ["Publish cards"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Export cards for the web UI
        run: go run ./cmd/cartitas web-export

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deploy
        uses: actions/deploy-pages@v4
