name: Publish cards

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run (no commit)
        type: boolean
        default: false
      topic:
        description: Optional single topic key (e.g. geography)
        type: string
        required: false
      lang:
        description: Optional language (en, es, de). Default all.
        type: choice
        options:
          - en
          - es
          - de
        required: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Dry run
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: |
          ARGS=""
          [ -n "${{ inputs.topic }}" ] && ARGS="$ARGS --topic ${{ inputs.topic }}"
          [ -n "${{ inputs.lang }}" ] && ARGS="$ARGS --lang ${{ inputs.lang }}"
          go run ./cmd/cartitas publish --dry-run $ARGS

      - name: Publish queued cards
        if: github.event_name != 'workflow_dispatch' || !inputs.dry_run
        run: |
          ARGS=""
          [ -n "${{ inputs.topic }}" ] && ARGS="$ARGS --topic ${{ inputs.topic }}"
          [ -n "${{ inputs.lang }}" ] && ARGS="$ARGS --lang ${{ inputs.lang }}"
          go run ./cmd/cartitas publish $ARGS

      - name: Validate published cards
        if: github.event_name != 'workflow_dispatch' || !inputs.dry_run
        run: |
          go run ./cmd/cartitas validate
          hashcards check cards/ 2>/dev/null || true

      - name: Commit and push
        if: github.event_name != 'workflow_dispatch' || !inputs.dry_run
        run: |
          git config user.name "cartitas-bot"
          git config user.email "cartitas-bot@users.noreply.github.com"
          if git diff --quiet; then
            echo "Nothing to publish."
            exit 0
          fi
          git add cards/ queue/
          git commit \
            -m "publish: release queued cards (all languages)" \
            -m "Automated publish from queue/{lang}/ per publish.yaml rates."
          git push
