name: Validate cards

on:
  push:
    branches: [main, automation/queue-cards]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Go tests
        run: go test ./...

      - name: Card syntax validation
        run: go run ./cmd/cartitas validate

      - name: Trilingual queue validation
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          BASE="$PR_BASE"
          if [ -z "$BASE" ]; then
            BASE="$PUSH_BEFORE"
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "No PR/push base; checking working tree changes vs HEAD"
            go run ./cmd/cartitas validate-trilingual --stage queue --changed-from HEAD
          else
            echo "Checking queue sets changed since $BASE"
            go run ./cmd/cartitas validate-trilingual --stage queue --changed-from "$BASE"
          fi

      - name: Install hashcards
        run: cargo install hashcards --locked
        continue-on-error: true

      - name: hashcards check
        run: |
          if command -v hashcards >/dev/null; then
            for lang in en es de; do
              if [ -d "cards/$lang" ]; then
                hashcards check "cards/$lang/"
              fi
            done
          else
            echo "hashcards not installed; skipped collection check"
          fi
