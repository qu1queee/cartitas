name: Validate cards

on:
  push:
    branches: [main, automation/draft-cards]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Card syntax validation
        run: python scripts/validate.py

      - name: Trilingual draft validation
        run: python scripts/validate_trilingual.py --stage draft

      - name: Install hashcards
        run: cargo install hashcards --locked
        continue-on-error: true

      - name: hashcards check
        run: |
          if command -v hashcards >/dev/null; then
            for lang in en es de; do
              if [ -d "cards/$lang" ]; then
                hashcards check "cards/$lang/"
              fi
            done
          else
            echo "hashcards not installed; skipped collection check"
          fi
