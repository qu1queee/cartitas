name: Generate draft cards

# Generates the same draft cards in en, es, and de into one shared PR branch.
# Scheduled runs auto-pick topic/subtopic; manual runs use workflow inputs.
# Requires OPENAI_API_KEY for scheduled/manual generation.

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      topic:
        description: Topic key (leave empty on schedule — auto-picked)
        type: choice
        options:
          - geography
          - space
          - animals
          - sports
          - science
        required: true
      subtopic:
        description: Subtopic slug (e.g. continents, moon, pets)
        type: string
        required: true
      count:
        description: Number of cards per language
        type: number
        default: 5
      age_band:
        description: Age band
        type: choice
        options:
          - early
          - middle
          - teen
        default: early

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt openai

      - name: Resolve generate target
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            {
              echo "topic=${{ inputs.topic }}"
              echo "subtopic=${{ inputs.subtopic }}"
              echo "age_band=${{ inputs.age_band }}"
              echo "count=${{ inputs.count }}"
            } >> "$GITHUB_OUTPUT"
          else
            python scripts/pick_generate_target.py --github-output "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

      - name: Generate draft cards (en, es, de)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python scripts/generate.py \
            --topic "${{ steps.target.outputs.topic }}" \
            --subtopic "${{ steps.target.outputs.subtopic }}" \
            --count "${{ steps.target.outputs.count }}" \
            --age-band "${{ steps.target.outputs.age_band }}" \
            --all-langs

      - name: Validate drafts
        run: |
          python scripts/validate.py
          python scripts/validate_trilingual.py --stage draft

      - name: Open or update draft PR
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/draft-cards
          delete-branch: false
          base: main
          commit-message: "draft(${{ steps.target.outputs.topic }}/${{ steps.target.outputs.subtopic }}): ${{ steps.target.outputs.count }} cards x3 langs"
          title: "Draft cards (automation)"
          body: |
            Automated **trilingual** draft flashcards for review.

            **This run**
            - Topic: `${{ steps.target.outputs.topic }}`
            - Subtopic: `${{ steps.target.outputs.subtopic }}`
            - Age band: `${{ steps.target.outputs.age_band }}`
            - Cards per language: `${{ steps.target.outputs.count }}`
            - Languages: `en`, `es`, `de` (all required)

            ## Review checklist

            - [ ] All three files exist with the same filename
            - [ ] Same facts and card count in en / es / de
            - [ ] Move approved sets to `queue/{lang}/{Topic}/`
            - [ ] Merge when ready

      - name: Ensure PR is open
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pr=$(gh pr list --head automation/draft-cards --base main --state open --json url -q '.[0].url')
          if [ -z "$pr" ]; then
            echo "::error::No open PR on automation/draft-cards"
            exit 1
          fi
          echo "Open PR: $pr"
