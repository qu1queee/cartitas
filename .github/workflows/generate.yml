name: Generate draft cards

# Generates the same draft cards in en, es, and de into one shared PR branch.
# Requires OPENAI_API_KEY.

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      topic:
        description: Topic key
        type: choice
        options:
          - geography
          - space
          - animals
          - sports
          - science
        required: true
      subtopic:
        description: Subtopic slug (e.g. continents, moon, pets)
        type: string
        required: true
      count:
        description: Number of cards per language
        type: number
        default: 5
      age_band:
        description: Age band
        type: choice
        options:
          - early
          - middle
          - teen
        default: early

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt openai

      - name: Generate draft cards (en, es, de)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python scripts/generate.py \
            --topic "${{ inputs.topic }}" \
            --subtopic "${{ inputs.subtopic }}" \
            --count "${{ inputs.count }}" \
            --age-band "${{ inputs.age_band }}" \
            --all-langs

      - name: Validate drafts
        run: |
          python scripts/validate.py
          python scripts/validate_trilingual.py

      - name: Open or update draft PR
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/draft-cards
          delete-branch: false
          commit-message: "draft(${{ inputs.topic }}/${{ inputs.subtopic }}): generate ${{ inputs.count }} cards x3 langs"
          title: "Draft cards (automation)"
          body: |
            Automated trilingual draft flashcards for review.

            **Latest run**
            - Topic: `${{ inputs.topic }}`
            - Subtopic: `${{ inputs.subtopic }}`
            - Age band: `${{ inputs.age_band }}`
            - Cards per language: `${{ inputs.count }}`
            - Languages: `en`, `es`, `de`

            Files:
            - `draft/en/{Topic}/${{ inputs.subtopic }}_${{ inputs.age_band }}.md`
            - `draft/es/{Topic}/${{ inputs.subtopic }}_${{ inputs.age_band }}.md`
            - `draft/de/{Topic}/${{ inputs.subtopic }}_${{ inputs.age_band }}.md`

            ## Review

            1. Check all three language files share the same facts
            2. Move approved files to `queue/{lang}/{Topic}/`
            3. Merge when ready

      - name: Ensure PR is open
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pr=$(gh pr list --head automation/draft-cards --base main --state open --json url -q '.[0].url')
          if [ -z "$pr" ]; then
            echo "No open PR found (create-pull-request should have created one)"
            exit 1
          fi
          echo "Open PR: $pr"
